---
name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-only-deployment-check-secret-with-more-than-fifty-characters-123
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  MODEL_PATH: models/model.pkl
  MODEL_METADATA_PATH: models/model_metadata.json
  PORT: "8000"
  MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db

jobs:
  test-and-build:
    name: Test, quality gate, and image build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Verify Ruff formatting
        run: uv run ruff format --check .

      - name: Download checksum-verified churn dataset
        run: uv run python manage.py download_churn_data --overwrite

      - name: Verify downloaded dataset
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from ml_pipeline.services.data import load_churn_data

          dataset = load_churn_data(Path("data/telco_churn.csv"))
          if len(dataset) != 7043:
              raise SystemExit(f"Expected 7043 dataset rows, found {len(dataset)}.")
          print(f"Validated churn dataset: {len(dataset)} rows, {len(dataset.columns)} columns")
          PY

      - name: Run Django system checks
        run: uv run python manage.py check

      - name: Run Django deployment checks
        env:
          RENDER_EXTERNAL_HOSTNAME: churn-api-ci.example.invalid
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Apply database migrations
        run: uv run python manage.py migrate --noinput

      - name: Run model-quality gate
        run: uv run pytest -m model_quality -v

      - name: Run full test suite with coverage
        run: uv run pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Verify committed model artifacts
        run: |
          test -s models/model.pkl
          test -s models/model_metadata.json
          uv run python manage.py shell -c \
            "from predictions.services.model_loader import get_model_bundle; get_model_bundle()"

      - name: Build Django API image
        run: docker build -t churn-api .

  frontend:
    name: Lint, test, and build Next.js frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RENDER_API_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint checks
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Run frontend type checks
        working-directory: frontend
        run: npm run typecheck

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
