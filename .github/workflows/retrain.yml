---
name: Weekly model retraining

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: retrain-${{ github.ref }}
  cancel-in-progress: false

env:
  DJANGO_SECRET_KEY: retraining-only-not-a-production-secret
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  MODEL_PATH: models/model.pkl
  MODEL_METADATA_PATH: models/model_metadata.json
  PORT: "8000"
  MLFLOW_TRACKING_URI: sqlite:///mlflow-retraining.db

jobs:
  retrain:
    name: Train and validate an isolated candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Download checksum-verified churn dataset
        run: uv run python manage.py download_churn_data --overwrite

      - name: Verify downloaded dataset
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from ml_pipeline.services.data import load_churn_data

          dataset = load_churn_data(Path("data/telco_churn.csv"))
          if len(dataset) != 7043:
              raise SystemExit(f"Expected 7043 dataset rows, found {len(dataset)}.")
          print(f"Validated churn dataset: {len(dataset)} rows, {len(dataset.columns)} columns")
          PY

      - name: Train isolated candidate model
        run: |
          uv run python manage.py train_churn_model \
            --model-path artifacts/candidate/model.pkl \
            --metadata-path artifacts/candidate/model_metadata.json

      - name: Verify candidate files
        run: |
          test -s artifacts/candidate/model.pkl
          test -s artifacts/candidate/model_metadata.json

      - name: Apply model-promotion policy
        run: |
          uv run python manage.py promote_churn_model \
            --candidate-model artifacts/candidate/model.pkl \
            --candidate-metadata artifacts/candidate/model_metadata.json \
            --current-metadata models/model_metadata.json \
            --output-dir artifacts/approved

      - name: Verify approved model can load
        env:
          MODEL_PATH: artifacts/approved/model.pkl
          MODEL_METADATA_PATH: artifacts/approved/model_metadata.json
        run: |
          uv run python manage.py shell -c \
            "from predictions.services.model_loader import get_model_bundle; get_model_bundle()"

      - name: Run Django checks against approved model
        env:
          MODEL_PATH: artifacts/approved/model.pkl
          MODEL_METADATA_PATH: artifacts/approved/model_metadata.json
        run: uv run python manage.py check

      - name: Run all tests after retraining
        env:
          MODEL_PATH: artifacts/approved/model.pkl
          MODEL_METADATA_PATH: artifacts/approved/model_metadata.json
        run: uv run pytest -v

      - name: Upload approved model bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: approved-churn-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/approved/model.pkl
            artifacts/approved/model_metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload candidate metadata for audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: churn-model-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidate/model_metadata.json
          if-no-files-found: warn
          retention-days: 30

  promote:
    name: Commit an approved model on main
    needs: retrain
    if: github.ref == 'refs/heads/main' && needs.retrain.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Required only to push the approved artifact pair.
    outputs:
      promoted: ${{ steps.commit_model.outputs.promoted }}
      render_triggered: ${{ steps.trigger_render.outputs.triggered }}

    steps:
      - name: Check out repository for promotion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download approved model bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: approved-churn-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/approved

      - name: Commit approved model when artifacts changed
        id: commit_model
        run: |
          test -s artifacts/approved/model.pkl
          test -s artifacts/approved/model_metadata.json
          cp artifacts/approved/model.pkl models/model.pkl
          cp artifacts/approved/model_metadata.json models/model_metadata.json
          git add models/model.pkl models/model_metadata.json

          if git diff --cached --quiet; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update weekly churn model"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render rebuild for promoted model
        id: trigger_render
        if: steps.commit_model.outputs.promoted == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if test -z "$RENDER_DEPLOY_HOOK_URL"; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not configured; trigger Render manually."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::add-mask::$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_URL" \
            > /dev/null
          echo "triggered=true" >> "$GITHUB_OUTPUT"

  summarize:
    name: Summarize retraining metrics
    needs:
      - retrain
      - promote
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Download candidate metadata
        id: download_metadata
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: churn-model-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: models

      - name: Write retraining job summary
        env:
          PROMOTED: ${{ needs.promote.outputs.promoted || 'false' }}
          RENDER_TRIGGERED: ${{ needs.promote.outputs.render_triggered || 'false' }}
          PROMOTION_RESULT: ${{ needs.promote.result }}
          RETRAIN_RESULT: ${{ needs.retrain.result }}
        run: |
          {
            echo "## Weekly churn model retraining"
            echo
            if test -s models/model_metadata.json; then
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Model | $(jq -r '.model_name' models/model_metadata.json) |"
              echo "| Version | $(jq -r '.model_version' models/model_metadata.json) |"
              echo "| ROC-AUC | $(jq -r '.roc_auc' models/model_metadata.json) |"
              echo "| PR-AUC | $(jq -r '.pr_auc' models/model_metadata.json) |"
              echo "| F1 | $(jq -r '.f1' models/model_metadata.json) |"
              echo "| Dataset rows | $(jq -r '.dataset_rows' models/model_metadata.json) |"
              echo "| Trained at | $(jq -r '.training_date' models/model_metadata.json) |"
              echo "| Retraining result | ${RETRAIN_RESULT} |"
              echo "| Promotion job result | ${PROMOTION_RESULT} |"
              echo "| Promoted to repository | ${PROMOTED} |"
              echo "| Render rebuild triggered | ${RENDER_TRIGGERED} |"
            else
              echo "Training did not produce model metadata."
              echo
              echo "- Retraining result: ${RETRAIN_RESULT}"
              echo "- Promoted to repository: false"
              echo "- Render rebuild triggered: false"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
