# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
---
services:
  - type: web
    name: telecom-churn-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: MODEL_PATH
        value: /app/models/model.pkl
      - key: MODEL_METADATA_PATH
        value: /app/models/model_metadata.json
