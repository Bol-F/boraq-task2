services:
  api:
    build:
      context: .
    image: churn-api:local
    init: true
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-development-secret}"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MODEL_PATH: "/app/models/model.pkl"
      MODEL_METADATA_PATH: "/app/models/model_metadata.json"
      PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/api/health/", timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
