[project]
name = "telecom-customer-churn-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.2",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.0.0",
    "joblib>=1.5.3",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dashboard = [
    "streamlit>=1.61.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.16.1",
]
training = [
    "mlflow>=3.15.1",
]

[tool.uv]
default-groups = ["dev", "training", "dashboard"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: fast isolated tests using local fixtures and mocks",
    "integration: tests multiple application layers using local resources",
    "model_quality: evaluates the production pipeline on the real churn dataset",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "config/asgi.py",
    "config/wsgi.py",
    "dashboard/app.py",
    "manage.py",
    "tests/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
