[project]
name = "telecom-customer-churn-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.2",
    "gunicorn>=26.0.0",
    "joblib>=1.5.3",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
